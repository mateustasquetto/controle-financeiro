<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141e33"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>

    <!-- Gradiente Neon Principal -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>

    <!-- Brilho Neon (Glow) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo do App Icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Hexágono Tech Central -->
  <polygon points="256,70 410,158 410,354 256,442 102,354 102,158" 
           fill="none" 
           stroke="url(#neonGrad)" 
           stroke-width="12" 
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Linhas de Circuito / Nós de Conexão -->
  <circle cx="256" cy="70" r="10" fill="#00f0ff" />
  <circle cx="410" cy="158" r="10" fill="#7000ff" />
  <circle cx="410" cy="354" r="10" fill="#00ff88" />
  <circle cx="256" cy="442" r="10" fill="#00f0ff" />
  <circle cx="102" cy="354" r="10" fill="#7000ff" />
  <circle cx="102" cy="158" r="10" fill="#00ff88" />

  <!-- Símbolo Financeiro ($) Estilizado -->
  <g filter="url(#glow)">
    <!-- Linha vertical do $ -->
    <line x1="256" y1="140" x2="256" y2="372" stroke="#00f0ff" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Texto do $ -->
    <text x="256" y="335" 
          font-family="'Segoe UI', Roboto, sans-serif" 
          font-size="210" 
          font-weight="900" 
          fill="url(#neonGrad)" 
          text-anchor="middle">
      $
    </text>
  </g>
</svg>
