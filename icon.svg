<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente da Borda / Papel Externo da Cédula -->
    <linearGradient id="bordaCedula" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Gradiente Interno Claro da Nota -->
    <linearGradient id="mioloCedula" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>

    <!-- Sombra suave projetada -->
    <filter id="sombra" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Grupo centralizado da Cédula com leve rotação para preencher melhor o ícone -->
  <g transform="rotate(-8 256 256)" filter="url(#sombra)">
    <!-- Corpo da Cédula -->
    <rect x="26" y="126" width="460" height="260" rx="24" fill="url(#bordaCedula)" stroke="#86efac" stroke-width="4"/>

    <!-- Moldura Interna -->
    <rect x="44" y="144" width="424" height="224" rx="16" fill="url(#mioloCedula)" stroke="#166534" stroke-width="3.5"/>
    <rect x="54" y="154" width="404" height="204" rx="12" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="8,5"/>

    <!-- Numerais dos 4 Cantos -->
    <circle cx="82" cy="180" r="16" fill="#22c55e" opacity="0.25"/>
    <text x="82" y="187" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" fill="#14532d" text-anchor="middle">1</text>

    <circle cx="430" cy="180" r="16" fill="#22c55e" opacity="0.25"/>
    <text x="430" y="187" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" fill="#14532d" text-anchor="middle">1</text>

    <circle cx="82" cy="332" r="16" fill="#22c55e" opacity="0.25"/>
    <text x="82" y="339" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" fill="#14532d" text-anchor="middle">1</text>

    <circle cx="430" cy="332" r="16" fill="#22c55e" opacity="0.25"/>
    <text x="430" y="339" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" fill="#14532d" text-anchor="middle">1</text>

    <!-- Detalhes de Gravura Laterais -->
    <path d="M 125 210 Q 145 256 125 302" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M 387 210 Q 367 256 387 302" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Medalhão Central -->
    <ellipse cx="256" cy="256" rx="84" ry="88" fill="#dcfce7" stroke="#166534" stroke-width="4.5"/>
    <ellipse cx="256" cy="256" rx="74" ry="78" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="5,4"/>

    <!-- Traço Vertical do Cifrão -->
    <line x1="256" y1="195" x2="256" y2="317" stroke="#14532d" stroke-width="10" stroke-linecap="round"/>

    <!-- Símbolo $ -->
    <text x="256" y="297" 
          font-family="'Segoe UI', Arial, sans-serif" 
          font-size="124" 
          font-weight="900" 
          fill="#14532d" 
          text-anchor="middle">
      $
    </text>
  </g>
</svg>
